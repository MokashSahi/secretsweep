services:
  nginx-proxy:
    image: nginx:latest
    container_name: tp-nginx
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - shared
    depends_on:
      - web-app
  web-app:
    image: tp-app-web:alpine
    privileged: True
    container_name: tp-app-web
    restart: always
    ports:
      - "8000:8000"
    networks:
      - shared
    environment:
      - DEBUG=true
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_NAME=tp_db
      - DATABASE_USER=tp_user
      - DATABASE_PASSWORD=tp_secure_password_123
      - FLASK_ENV=development
      - SECRET_KEY=my-insecure-secret-key-12345
    depends_on:
      - db
  db:
    image: postgres:15
    container_name: tp-db
    restart: always
    ports:
      - "5432:5432"
    networks:
      - shared
    environment:
      - POSTGRES_DB=tp_db
      - POSTGRES_USER=tp_user
      - POSTGRES_PASSWORD=tp_secure_password_123
    volumes:
      - postgres-data:/var/lib/postgresql/data

networks:
  shared:
    driver: bridge

volumes:
  postgres-data:
    driver: local
